name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the file names, e.g. 0.0.2. Leave empty to use Server/Cargo.toml"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: roflux
          - os: windows-latest
            platform: windows-x86_64
            binary: roflux.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Server

      - name: Build
        run: cargo build --release --manifest-path Server/Cargo.toml

      - name: Check it runs
        shell: bash
        run: ./Server/target/release/${{ matrix.binary }} --version

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p "staging/${{ matrix.platform }}"
          cp "Server/target/release/${{ matrix.binary }}" "staging/${{ matrix.platform }}/"

      - name: Build the Studio plugin
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: ./Server/target/release/${{ matrix.binary }} plugin --output staging/RoFlux.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.platform }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: bundle
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          merge-multiple: true

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(grep -m1 '^version' Server/Cargo.toml | cut -d '"' -f2)
          fi
          echo "value=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Zip each platform
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p release
          for folder in parts/*/; do
            platform=$(basename "$folder")
            chmod +x "$folder"/* || true
            (cd "$folder" && zip -9 "../../release/roflux-$version-$platform.zip" *)
          done
          cp parts/RoFlux.rbxm release/

      - name: Show what was built
        run: |
          ls -lh release
          for archive in release/*.zip; do
            echo "== $archive"
            unzip -l "$archive"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: roflux-${{ steps.version.outputs.value }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
